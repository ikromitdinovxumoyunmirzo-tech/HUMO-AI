.lg{display:block;background:var(--logo) center/contain no-repeat;flex:none;border-radius:22%}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 0,#0f2e19 0,var(--bg) 60%) fixed,var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 14px 40px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{margin:0;font-size:26px;letter-spacing:1px}h1 span{color:var(--acc)}
.lang button{width:auto;padding:6px 10px;margin-left:4px;font-size:13px;background:var(--card);color:var(--text);border:1px solid var(--line)}
.lang button.on{background:var(--acc);color:#04140a;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
h2{margin:0 0 10px;font-size:16px}
button{font:inherit;border:0;border-radius:12px;padding:11px 16px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04140a;font-weight:700;width:100%;cursor:pointer}
button:disabled{opacity:.5}
input{font:inherit;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);width:100%}
.big{font-size:38px;font-weight:800;color:var(--acc);line-height:1}
.bar{height:12px;border-radius:8px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .4s}
.bar.over i{background:#d33}
.mut{color:var(--mut);font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .nm{flex:1;min-width:0}
.row input{width:72px;padding:7px}
.row button{width:auto;padding:7px 12px}
.g{display:flex;gap:8px}
.x{background:none;color:var(--mut);padding:4px 8px;width:auto;font-size:18px}
img#pv{width:100%;max-height:260px;object-fit:cover;border-radius:14px;display:none;margin-bottom:10px}
.drop{display:block;text-align:center;border:2px dashed var(--acc);border-radius:16px;padding:20px 10px;cursor:pointer;color:var(--mut)}
.err{color:#d33;margin-top:8px;font-size:14px}
#list{max-height:360px;overflow:auto;margin-top:8px}
.x{background:none!important;color:var(--mut)}
</style>
</head>

<main>
<div class="top"><h1 style="display:flex;align-items:center;gap:8px"><i class="lg" style="width:42px;height:42px"></i>HUMO <span>AI</span></h1><div class="lang" id="lang"></div></div>
<div id="auth" class="card"><div class="lg" style="width:190px;height:190px;margin:0 auto 14px"></div><input id="an" type="text" autocomplete="username" data-p="nm" style="margin-bottom:8px"><input id="ap" type="password" autocomplete="current-password" data-p="pw" style="margin-bottom:10px"><button id="ab"></button><button id="at" class="x" style="margin-top:8px;width:100%;color:var(--acc)!important"></button><div id="ae" class="err"></div></div>
<div id="app" style="display:none"><div style="text-align:right;margin-bottom:8px"><span class="mut" id="who"></span> <button id="out" class="x" data-t="logout" style="font-size:14px"></button></div>

<div class="card">
  <h2 data-t="today"></h2>
  <div class="g" style="align-items:baseline"><div class="big" id="eaten">0</div><div class="mut">/ <span id="goalv">2000</span> <span data-t="kcal"></span></div></div>
  <div class="bar" id="bar"><i id="fill"></i></div>
  <div class="mut" id="left"></div>
  <div class="g" style="margin-top:10px"><input id="goal" type="number" inputmode="numeric" min="500" max="10000" data-p="goalph"><button id="setg" style="width:auto" data-t="save"></button></div>
</div>

<div class="card">
  <h2 data-t="log"></h2>
  <div id="logl"></div>
</div>

<div class="card">
  <h2 data-t="scan"></h2>
  <img id="pv" alt="">
  <label class="drop" id="drop"><div style="font-size:34px">📷</div><span data-t="take"></span><input id="file" type="file" accept="image/*" capture="environment" hidden></label>
  <button id="go" style="display:none;margin-top:10px" data-t="analyze"></button>
  <button id="re" class="x" style="display:none;width:100%;margin-top:6px;color:var(--acc)!important" data-t="again"></button>
  <div id="err" class="err"></div>
  <div id="res"></div>
</div>

<div class="card">
  <h2 data-t="dishes"></h2>
  <input id="q" type="search" data-p="search">
  <div id="list"></div>
</div>
<p class="mut" style="text-align:center" data-t="note"></p>
</div>
</main>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var S={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
var T={

ru:{today:"Сегодня",kcal:"ккал",save:"Сохранить",goalph:"Дневная цель (ккал)",log:"Что я съел сегодня",scan:"Сканер еды",take:"Сфотографируйте или выберите",analyze:"Определить калории",dishes:"База блюд",search:"Поиск блюда...",add:"+ Добавить",left:"Осталось",over:"Превышена норма",empty:"Пока ничего не добавлено",note:"Результаты приблизительные, не медицинский совет.",ai:"ИИ-сканер работает только в онлайн-версии.",fail:"Ошибка, попробуйте снова.",wait:"Анализируем...",lang:"russian",p:"Белки",f:"Жиры",c:"Углеводы",g:"г",per:"на 100 г",again:"↻ Другое фото",reg:"Регистрация",login:"Войти",nm:"Имя / логин",pw:"Пароль (минимум 4 символа)",noacc:"Нет аккаунта? Зарегистрируйтесь",haveacc:"Уже есть аккаунт? Войти",wrong:"Неверный логин или пароль",exists:"Этот логин занят",short:"Заполните логин и пароль (минимум 4 символа)",logout:"Выйти",hi:"Привет"},
en:{today:"Today",kcal:"kcal",save:"Save",goalph:"Daily goal (kcal)",log:"What I ate today",scan:"Food scanner",take:"Take a photo or choose one",analyze:"Estimate calories",dishes:"Dish database",search:"Search dishes...",add:"+ Add",left:"Left",over:"Over your goal",empty:"Nothing added yet",note:"Estimates only, not medical advice.",ai:"AI scanner works only in the online version.",fail:"Error, please try again.",wait:"Analyzing...",lang:"english",p:"Protein",f:"Fat",c:"Carbs",g:"g",per:"per 100 g",again:"↻ Another photo",reg:"Sign up",login:"Log in",nm:"Name / username",pw:"Password (min 4 characters)",noacc:"No account? Sign up",haveacc:"Have an account? Log in",wrong:"Wrong username or password",exists:"This username is taken",short:"Enter username and password (min 4 characters)",logout:"Log out",hi:"Hello"}
};
// [uz, ru, en, kcal/100g, portion g]
var D=[
["Palov (osh)","Плов","Plov (pilaf)",190,300],["Somsa (go'shtli)","Самса с мясом","Samsa (meat)",280,120],["Somsa (qovoqli)","Самса с тыквой","Samsa (pumpkin)",230,120],
["Lag'mon","Лагман","Lagman",130,400],["Qovurma lag'mon","Жареный лагман","Fried lagman",170,350],["Manti","Манты","Manti",200,200],["Chuchvara","Чучвара","Chuchvara",190,250],
["Sho'rva","Шурпа","Shurpa",70,350],["Mastava","Мастава","Mastava",80,350],["Moshxo'rda","Машхурда","Mashkhurda",90,350],["Moshkichiri","Мошкичири","Moshkichiri",130,350],
["Norin","Нарын","Norin",220,250],["Dimlama","Димлама","Dimlama",110,350],["Beshbarmoq","Бешбармак","Beshbarmak",200,350],["Mampar","Мампар","Mampar",90,350],
["Qozon kabob","Казан-кабоб","Kazan kabob",250,250],["Shashlik (go'sht)","Шашлык","Shashlik",250,150],["Jigar kabob","Печёнка на мангале","Liver kebab",190,120],["Tandir go'sht","Тандыр-мясо","Tandoor lamb",260,200],
["Do'lma","Долма","Dolma",150,250],["Xonim","Ханум","Khanum",170,250],["Qazi","Казы","Qazy (horse sausage)",320,100],["Kuurdoq","Куурдак","Kuurdak",300,250],
["Ugra osh","Угра-аш","Ugra osh",120,300],["Achichuk salat","Салат ачичук","Achichuk salad",25,150],["Olivye salati","Оливье","Olivier salad",190,200],["Tarvuz/qovun","Арбуз/дыня","Watermelon/melon",35,300],
["Non (patir)","Патыр (лепёшка)","Patir (flatbread)",270,100],["Obi non","Оби-нон","Obi non",260,100],["Qatlama","Катлама","Qatlama",380,100],["Lavash","Лаваш","Lavash",240,100],
["Chak-chak","Чак-чак","Chak-chak",400,50],["Halva","Халва","Halva",520,50],["Navvot","Навват","Navvot (rock sugar)",390,30],["Paxlava","Пахлава","Baklava",430,60],["Sumalak","Сумаляк","Sumalak",150,200],
["Qaymoq","Каймак","Kaymak (cream)",300,30],["Qatiq","Катык","Katyk (yogurt)",60,200],["Ayron","Айран","Ayran",30,250],["Suzma","Сузьма","Suzma (strained curd)",150,50],["Yashil choy (shakarsiz)","Зелёный чай (без сахара)","Green tea (no sugar)",1,250],["Qora choy + 2 qand","Чёрный чай + 2 сахара","Black tea + 2 sugar",30,250],
["Borsh","Борщ","Borscht",50,300],["Pelmeni","Пельмени","Pelmeni",250,250],["Blin","Блины","Pancakes",230,100],["Grechka","Гречка","Buckwheat",110,200],["Guruch (qaynatilgan)","Рис отварной","Boiled rice",130,200],
["Makaron","Макароны","Pasta",160,250],["Kartoshka fri","Картофель фри","French fries",310,120],["Qovurilgan kartoshka","Жареная картошка","Fried potatoes",190,200],["Kotlet","Котлета","Cutlet",220,100],
["Tovuq (qovurilgan)","Курица жареная","Fried chicken",240,150],["Tuxum","Яйцо","Egg",155,60],["Lavash shaurma","Шаурма","Shawarma",220,250],["Burger","Бургер","Burger",250,200],["Pitsa","Пицца","Pizza",270,120],
["Olma","Яблоко","Apple",52,150],["Banan","Банан","Banana",89,120],["Uzum","Виноград","Grapes",69,150],["Kola","Кола","Cola",42,330],["Shokolad","Шоколад","Chocolate",540,30]
];
var lang=S.get("humo_lang")||"uz", user=null, goal=2000, key="", log=[],last=null,blob=null;
function esc(s){var d=document.createElement("div");d.textContent=String(s==null?"":s);return d.innerHTML}
function tr(){var t=T[lang];document.documentElement.lang=lang;
 [].forEach.call(document.querySelectorAll("[data-t]"),function(e){e.textContent=t[e.dataset.t]});
 [].forEach.call(document.querySelectorAll("[data-p]"),function(e){e.placeholder=t[e.dataset.p]});
 $("lang").innerHTML=["uz","ru","en"].map(function(l){return '<button data-l="'+l+'" class="'+(l==lang?"on":"")+'">'+l.toUpperCase()+"</button>"}).join("");
 $("goal").value=goal;paint();dishes()}
function paint(){var t=T[lang];am();if(user)$("who").textContent=t.hi+", "+user;var sum=log.reduce(function(a,x){return a+x.k},0),pc=Math.min(100,sum/goal*100);
 $("eaten").textContent=sum;$("goalv").textContent=goal;$("fill").style.width=pc+"%";$("bar").className="bar"+(sum>goal?" over":"");
 $("left").textContent=sum>goal?t.over+": "+(sum-goal)+" "+t.kcal:t.left+": "+(goal-sum)+" "+t.kcal;
 $("logl").innerHTML=log.length?log.map(function(x,i){return '<div class="row"><div class="nm">'+esc(x.n)+'<div class="mut">'+esc(x.g)+'</div></div><b>'+x.k+'</b><button class="x" data-d="'+i+'">✕</button></div>'}).join(""):'<div class="mut">'+t.empty+"</div>"}
function save(){S.set(key,JSON.stringify(log));paint()}
function dishes(){var t=T[lang],q=$("q").value.trim().toLowerCase(),i={uz:0,ru:1,en:2}[lang];
 var r=D.map(function(d,j){return[d,j]}).filter(function(p){return!q||p[0].slice(0,3).join(" ").toLowerCase().indexOf(q)>-1});
 $("list").innerHTML=r.map(function(p){var d=p[0];return '<div class="row"><div class="nm">'+esc(d[i])+'<div class="mut">'+d[3]+" "+t.kcal+" "+t.per+'</div></div><input type="number" inputmode="numeric" id="g'+p[1]+'" value="'+d[4]+'"><button data-a="'+p[1]+'">+</button></div>'}).join("")}
document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
 if(b.dataset.l){lang=b.dataset.l;S.set("humo_lang",lang);tr()}
 else if(b.dataset.d){log.splice(+b.dataset.d,1);save()}
 else if(b.dataset.a){var d=D[+b.dataset.a],g=parseFloat($("g"+b.dataset.a).value)||d[4];log.push({n:d[{uz:0,ru:1,en:2}[lang]],g:g+" "+T[lang].g,k:Math.round(d[3]*g/100)});save()}
 else if(b.id=="addscan"&&last){log.push({n:last.taom,g:last.porsiya,k:Math.round(+last.jami_kkal)||0});save();reset()}});
$("setg").onclick=function(){var v=parseInt($("goal").value);if(v>=500&&v<=10000){goal=v;S.set("humo_goal_"+user,v);paint()}};
$("q").oninput=dishes;
var sample=null;
if(typeof claude!=="undefined"&&claude.use){claude.use("sample").then(function(s){sample=s}).catch(function(){})}
function reset(){blob=null;last=null;$("file").value="";$("pv").style.display="none";$("pv").removeAttribute("src");$("go").style.display="none";$("re").style.display="none";$("drop").style.display="block";$("res").innerHTML="";$("err").textContent=""}
$("re").onclick=reset;
$("file").onchange=function(e){var f=e.target.files[0];if(!f)return;var im=new Image();im.onload=function(){var k=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(function(b){blob=b;$("pv").src=URL.createObjectURL(b);$("pv").style.display="block";$("go").style.display="block";$("re").style.display="block";$("drop").style.display="none"},"image/jpeg",.82)};im.src=URL.createObjectURL(f)};
function ask(P,b){if(sample)return sample(P,{images:[b],modelTier:"quick"});
 return new Promise(function(ok,no){var fr=new FileReader();fr.onload=function(){ok(fr.result.split(",")[1])};fr.onerror=no;fr.readAsDataURL(b)}).then(function(img){
  return fetch("/.netlify/functions/scan",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:P,image:img})})}).then(function(r){return r.json()}).then(function(j){if(j.error)throw new Error(j.error);return{text:j.text}})}
$("go").onclick=function(){var t=T[lang];$("err").textContent=""; var b=$("go");b.disabled=true;b.textContent=t.wait;
 var P='You are HUMO AI, a calorie estimator. Identify the food in the image (Uzbek dishes like plov, somsa, lagman, manti are common) and estimate the portion. Reply with JSON ONLY, no markdown: {"taom":"dish name in '+t.lang+'","porsiya":"e.g. 300 g","jami_kkal":number,"oqsil_g":number,"yog_g":number,"uglevod_g":number,"maslahat":"one short tip in '+t.lang+'"} or {"xato":"not food"}.';
 ask(P,blob).then(function(r){var m=r.text.match(/\{[\s\S]*\}/),o=JSON.parse(m[0]);
  if(o.xato){$("err").textContent=o.xato;return}last=o;
  $("res").innerHTML='<div class="row" style="display:block"><div class="mut">'+esc(o.taom)+" · "+esc(o.porsiya)+'</div><div class="big">'+esc(o.jami_kkal)+' <span style="font-size:16px">'+t.kcal+'</span></div><div class="mut">'+t.p+" "+esc(o.oqsil_g)+" · "+t.f+" "+esc(o.yog_g)+" · "+t.c+" "+esc(o.uglevod_g)+"</div><div class=\"mut\">💡 "+esc(o.maslahat)+'</div><button id="addscan" style="margin-top:10px">'+t.add+"</button></div>"})
 .catch(function(){$("err").textContent=t.fail}).then(function(){b.disabled=false;b.textContent=T[lang].analyze})};
var mode="reg",users={};
try{users=JSON.parse(S.get("humo_users")||"{}")}catch(e){users={}}
function hs(s){if(window.crypto&&crypto.subtle){return crypto.subtle.digest("SHA-256",new TextEncoder().encode("humo:"+s)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return("0"+x.toString(16)).slice(-2)}).join("")})}var n=5381,i;for(i=0;i<s.length;i++)n=(n*33)^s.charCodeAt(i);return Promise.resolve("w"+(n>>>0))}
function am(){var t=T[lang];$("ab").textContent=mode=="reg"?t.reg:t.login;$("at").textContent=mode=="reg"?t.haveacc:t.noacc}
function enter(n){user=n;S.set("humo_session",n);goal=parseInt(S.get("humo_goal_"+n))||2000;key="humo_log_"+n+"_"+new Date().toISOString().slice(0,10);try{log=JSON.parse(S.get(key)||"[]")}catch(e){log=[]}$("auth").style.display="none";$("app").style.display="block";tr()}
$("at").onclick=function(){mode=mode=="reg"?"login":"reg";$("ae").textContent="";am()};
$("ab").onclick=function(){var t=T[lang],n=$("an").value.trim().toLowerCase(),p=$("ap").value;$("ae").textContent="";if(!n||p.length<4){$("ae").textContent=t.short;return}
hs(p).then(function(x){if(mode=="reg"){if(users[n]){$("ae").textContent=t.exists;return}users[n]=x;S.set("humo_users",JSON.stringify(users));enter(n)}else{if(users[n]&&users[n]==x)enter(n);else $("ae").textContent=t.wrong}})};
$("out").onclick=function(){S.set("humo_session","");user=null;$("ap").value="";$("app").style.display="none";$("auth").style.display="block"};
var ss=S.get("humo_session");
if(ss&&users[ss])enter(ss);else{if(Object.keys(users).length)mode="login";tr()}
})();
</script>
